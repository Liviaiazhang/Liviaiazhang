name: Update terminal card

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Generate ticker.svg
        env:
          OWM_KEY: ${{ secrets.OWM_KEY }}
        run: node build-svg.js

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ticker.svg
          if git diff --staged --quiet; then
            echo "No changes."
          else
            git commit -m "Update terminal card - $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi
